<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>IoT Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        h2 {
            color: #006666;
        }

        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }

        .msg-me {
            color: #1565C0;
            font-weight: bold;
        }

        .msg-them {
            color: #2E7D32;
        }

        .msg-sys {
            color: #888;
            font-style: italic;
        }

        input {
            width: 70%;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            background: #006666;
            color: white;
            border: none;
            cursor: pointer;
        }

        #status {
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h2>IoT Learning Hub - Chat</h2>

    <!-- Step 1: Enter name and Pi IP, then connect -->
    <div id="setup">

        <input
            id="nameInput"
            placeholder="Your name"
        />

        <br><br>

        <input
            id="ipInput"
            placeholder="Raspberry Pi IP (e.g. 192.168.1.100)"
        />

        <br><br>

        <button onclick="connect()">Connect</button>

    </div>


    <!-- Step 2: Chat area (hidden until connected) -->
    <div id="chatArea" style="display:none">

        <div id="status"></div>

        <div id="messages"></div>

        <input
            id="msgInput"
            placeholder="Type a message..."
        />

        <button onclick="sendMessage()">Send</button>

    </div>


    <script>

        let socket;
        let myName;


        function connect() {

            myName = document
                .getElementById("nameInput")
                .value
                .trim();

            const piIP = document
                .getElementById("ipInput")
                .value
                .trim();


            if (!myName || !piIP) {

                alert("Please enter your name and the Pi IP address.");
                return;

            }


            socket = new WebSocket(`ws://${piIP}:8765`);


            socket.onopen = function() {

                // Hide setup and show chat
                document.getElementById("setup")
                    .style.display = "none";

                document.getElementById("chatArea")
                    .style.display = "block";

                document.getElementById("status")
                    .textContent = `Connected as ${myName}`;


                addMessage(
                    `You joined as ${myName}`,
                    "msg-sys"
                );


                // Tell everyone we joined the chat
                socket.send(`*** ${myName} joined the chat! ***`);

            };


            socket.onmessage = function(event) {

                addMessage(
                    event.data,
                    "msg-them"
                );

            };


            socket.onclose = function() {

                addMessage(
                    "Disconnected from server.",
                    "msg-sys"
                );

            };


            socket.onerror = function() {

                alert(
                    "Could not connect. Check the IP and make sure the server is running."
                );

            };

        }


        function sendMessage() {

            const input = document
                .getElementById("msgInput");

            const text = input
                .value
                .trim();


            if (!text || !socket) {
                return;
            }


            const full = `[${myName}]: ${text}`;


            // Send to server (for other users)
            socket.send(full);


            // Show locally for sender
            addMessage(
                full,
                "msg-me"
            );


            input.value = "";

        }


        function addMessage(text, cssClass) {

            const div = document
                .getElementById("messages");

            const p = document.createElement("p");

            p.className = cssClass;

            p.textContent = text;

            div.appendChild(p);

            // Auto-scroll to bottom
            div.scrollTop = div.scrollHeight;

        }


        // Press Enter to send
        document.addEventListener(
            "keydown",
            function(e) {

                if (e.key === "Enter") {
                    sendMessage();
                }

            }
        );

    </script>

</body>

</html>
